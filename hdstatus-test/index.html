<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HD Status — тест</title>
<style>
:root{color-scheme:dark light;--bg:#0f1115;--card:#1a1d24;--fg:#f2f3f5;--mut:#8b919c;--acc:#25d366;--err:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--fg:#14161a;--mut:#6a707b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 16px 32px}
main{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:600;background:var(--acc);color:#04210f}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--mut);margin-top:10px}
button:disabled{opacity:.5}
#status{margin:14px 2px 0;font-size:14px;color:var(--mut)}#status.err{color:var(--err)}
.track{height:10px;background:rgba(128,128,128,.25);border-radius:6px;overflow:hidden;margin-top:6px}
#bar{height:100%;width:0;background:var(--acc);transition:width .2s}
#pct{font-size:13px;color:var(--mut);text-align:right;margin-top:4px}
video{width:100%;border-radius:12px;background:#000;max-height:60vh}
#info{font-size:13px;color:var(--mut);margin:10px 0 14px}
.hint{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>HD Status — тест</h1>
<p class="sub">Видео обрабатывается прямо на телефоне, никуда не загружается.</p>
<div class="card">
  <input id="file" type="file" accept="video/*" hidden>
  <button id="pick">Выбрать видео</button>
  <div id="status">Выберите видео из галереи</div>
  <div id="progress" hidden><div class="track"><div id="bar"></div></div><div id="pct">0%</div></div>
</div>
<div class="card" id="result" hidden>
  <video id="player" controls playsinline muted></video>
  <div id="info"></div>
  <button id="share">Поделиться (WhatsApp → Статус)</button>
  <button id="save" class="sec">Сохранить в «Файлы»</button>
  <button id="again" class="sec">Другое видео</button>
  <p class="hint">Если в «Поделиться» нет статуса: сохраните видео и выложите его из галереи WhatsApp как обычно.</p>
</div>
</main>
<script src="app.js"></script>
</body>
</html>
